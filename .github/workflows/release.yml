# Build the Vaultonaut desktop app on macOS, Windows, and Linux, and collect the installers.
#
# This is standard GitHub-Actions syntax, so it runs unchanged on GitHub's hosted runners (free for a public
# repository, including macOS and Windows). Later it also runs on self-hosted Forgejo Actions runners — copy it
# to .forgejo/workflows/, or point Forgejo at .github/workflows/. The same template serves other projects: change
# the build steps, keep the shape. (A self-hosted Windows runner must provide Git Bash for the `shell: bash`
# steps, which GitHub's hosted Windows runner already has.)
#
# Each runner's workspace path is already neutral (for example /Users/runner/work/...), so builds carry no
# personal identity; the leak scan inside `npm run build` confirms it (it recognizes generic CI accounts). Builds
# are UNSIGNED here — the private signing key is never placed in the repo or in CI. Sign separately, or add the
# key as an encrypted secret and a signing step if you decide to.

name: Build desktop apps

on:
  push:
    # A push to a listed BRANCH runs the TESTS ONLY. The build and release jobs are gated (below) to tags and manual
    # runs, so a branch push never builds installers and never publishes anything — it just verifies the suite. This
    # is the safe way to check a change (including a CI change) on every push, with no risk of a public release.
    branches:
      - master
    # Tag a release to build all platforms and publish a release. Matches a bare semver tag (1.0.0, 1.0.0-beta,
    # 1.0.0-rc.1) AND an optional "v" prefix (v1.0.0), so it fires regardless of tagging convention. These are
    # GitHub Actions filter globs, not regex: [0-9]+ is one-or-more digits, and the trailing -* covers a pre-release
    # suffix. If you tag some other way, add the pattern here or the build will not run.
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'       # 1.0.0
      - '[0-9]+.[0-9]+.[0-9]+-*'     # 1.0.0-beta, 1.0.0-rc.1
      - 'v[0-9]+.[0-9]+.[0-9]+'      # v1.0.0
      - 'v[0-9]+.[0-9]+.[0-9]+-*'    # v1.0.0-beta
  pull_request:
    # Same tests-only run for a pull request targeting these branches — no build, no release.
    branches:
      - master
  workflow_dispatch:    # or start a build by hand at any time
    inputs:
      release_tag:
        # The tag to build and attach the installers to (for example 1.0.0). Leave this BLANK for a build-only run:
        # every platform's installers are still uploaded as downloadable run artifacts, but no release is created or
        # changed. Enter an EXISTING release's tag only when you intend to replace that release's assets, since a
        # re-run clobbers them — to avoid touching a published release such as 1.0.0, use a new, unused tag instead.
        description: "Release tag to publish to (e.g. 1.0.0). Leave blank to build installers only, with no release."
        required: false
        default: ""
      build_only:
        # An explicit, unmistakable build-only switch. When checked, the release job is skipped no matter what the
        # tag says, so a run can never publish or overwrite a release by accident. The installers are still built on
        # all three platforms and uploaded as run artifacts. This overrides release_tag.
        description: "Build the installers only — never create or update any release (overrides the tag)."
        type: boolean
        default: false

# Least privilege: the build jobs only need to read the repository, so the workflow's token is read-only by
# default. The release job below re-grants itself the contents: write it needs to create the release, so write
# access is held by that one job and nothing else.
permissions:
  contents: read

jobs:
  # Run the unit suite before building or releasing anything. A tagged release must never draft from a broken app,
  # and this runs the FULL drift/regression suite that the fast smoke-only pre-commit hook skips. All three platforms
  # GATE a release: each must pass, so a failure on any of them blocks the build and the release. The one previously
  # known Windows flake — the relay per-IP throttle/cap assertions, whose loopback remoteAddress can be momentarily
  # empty on the Windows runner and split the per-IP grouping — is now skipped on Windows at the assertion level
  # (the code paths still run there; the outcome is fully checked on Linux/macOS), so Windows can gate without flaking.
  # The step below fetches the encryption engine first, so the ~90 engine-dependent tests actually run instead of
  # self-skipping; the mount-cycle tests still self-skip without a mount driver (FUSE-T / WinFsp), which the hosted
  # runners do not provide, but everything else is exercised on every platform. fail-fast is off so one platform's
  # failure never cancels the others (you see all three results), and the per-test timeout in the runner keeps a hang
  # on any platform from stalling the whole job.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
      - name: Install app dependencies
        shell: bash
        run: npm install --ignore-scripts --omit=optional --no-audit --no-fund   # --ignore-scripts: no dependency runs an install hook on the machine that builds the signed artifacts (matches the Docker build); --omit=optional: never fetch the optional native canvas peer, keeping the tree pure-JS
      # Fetch the checksum-verified encryption engine so the engine-dependent tests run instead of self-skipping. It
      # is a userspace binary download — no admin, kernel extension, or mount driver needed. Retry a few times so a
      # transient network blip does not fail the job, and fail the step (not silently pass) if it never becomes ready.
      - name: Download the encryption engine
        shell: bash
        run: |
          for i in 1 2 3; do
            node -e "require('./lib/RcloneSetup').ensure().then(r=>{console.log(r.ok?'engine ready':'setup failed');process.exit(r.ok?0:1)}).catch(e=>{console.error(String(e&&e.message||e));process.exit(1)})" && exit 0
            echo "engine setup attempt $i failed; retrying in 5s"; sleep 5
          done
          exit 1
      - name: Run the unit suite
        shell: bash
        run: npm run test:all

  build:
    needs: test
    # Only build installers for a real release: a version-tag push, or a manual run. A plain branch push or a pull
    # request runs the tests above and stops there — no installers, and (since release needs build) no release job.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows
          # Linux: build on the oldest supported base (Tauri's recommendation). It links against an older glibc,
          # so the deb and rpm run on more distributions — a wider compatibility floor for the same binaries.
          - os: ubuntu-22.04
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Pin Node to the version the bundle ships. Keep this in sync with PINNED_NODE in src-tauri/prepare-sidecar.js
      # (a drift test checks it); the build refuses to run on any other version.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1

      - name: Ensure a Rust toolchain
        shell: bash
        run: rustup default stable   # preinstalled on the hosted runners; self-hosted runners must have rustup

      - name: Linux build dependencies (WebKitGTK etc.)
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install app dependencies
        shell: bash
        run: npm install --ignore-scripts --omit=optional --no-audit --no-fund   # --ignore-scripts: no dependency runs an install hook on the machine that builds the signed artifacts (matches the Docker build); --omit=optional: never fetch the optional native canvas peer, keeping the tree pure-JS

      - name: Install packaging dependencies
        shell: bash
        working-directory: src-tauri
        run: npm install --ignore-scripts --omit=optional --no-audit --no-fund   # --ignore-scripts: no dependency runs an install hook on the machine that builds the signed artifacts (matches the Docker build); --omit=optional: never fetch the optional native canvas peer, keeping the tree pure-JS

      - name: Build (stage, bundle, leak-scan)
        shell: bash
        working-directory: src-tauri
        run: npm run build

      # macOS: guarantee the shipped .app is validly signed, then PROVE it in the log. Tauri ad-hoc-signs during the
      # bundle (bundle.macOS.signingIdentity "-"), but re-signing here with --force --deep is idempotent and makes the
      # signature bulletproof even if a nested binary (the bundled Node runtime) was missed. A broken or absent
      # signature is what makes a downloaded app show "damaged"; --verify FAILS THE BUILD loudly if signing did not
      # take, so a damaged binary can never reach a release again. spctl is expected to say "rejected" (ad-hoc is not
      # notarized) and that is fine — the app still opens via right-click -> Open. No-op on Windows and Linux.
      - name: Sign and verify the macOS app
        if: matrix.label == 'macos'
        shell: bash
        working-directory: src-tauri
        run: |
          APP=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' | head -n1)
          if [ -z "$APP" ]; then echo "No .app bundle found to sign"; exit 1; fi
          echo "Signing: $APP"
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" || true
          echo "Signature verified — the .app is signed."

      # These globs must cover whatever bundle.targets in tauri.conf.json produces. If a future Tauri adds or
      # renames an installer format, extend this list (a missing format is silent unless the whole set is empty).
      # The current set covers macOS dmg, Windows msi + nsis exe, and Linux deb + rpm.
      - name: Collect installers
        uses: actions/upload-artifact@v4
        with:
          name: vaultonaut-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm

  # When a version tag is pushed, gather every platform's installers, attach them to a GitHub Release, and PUBLISH
  # it, so the downloads are live for the public the moment the build finishes — no manual publish step. A re-run
  # replaces the assets on the same release and keeps it published. It uses the runner's built-in `gh` CLI
  # rather than a third-party action, so no outside code runs in this write-access job. (This job is
  # GitHub-specific; on Forgejo, replace it with Forgejo's release API. The build jobs above stay identical.)
  release:
    needs: build
    # Runs for a version tag push (any tag that triggered this workflow is a release tag, with or without a "v"
    # prefix), or for a manual run that supplied a release tag. A manual run skips this job — building installers
    # only — when the "build_only" box is checked OR the release tag is left blank; either way you still get the
    # installers as build artifacts, with no release, no publish, and no version bump. The first clause is written so
    # "build_only" applies only to a manual run (a tag push has no inputs), and it wins over the tag, so a build-only
    # run can never publish or overwrite a release even if a tag was typed in.
    if: (github.event_name != 'workflow_dispatch' || github.event.inputs.build_only != 'true') && (startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allow the run's token to create the release
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Publish or refresh the release with the installers attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          # Collect into an array so a path with a space is still passed as one argument (this file is reused
          # across projects, and another product's name could contain spaces).
          mapfile -t FILES < <(find installers -type f)
          # A prerelease tag (a hyphen, e.g. 1.1.0-beta) must not be marked the "Latest" release. The Docker workflow
          # already excludes prereleases from its moving tags; this keeps the two channels consistent.
          PRE_ARGS=()
          case "$TAG" in *-*) PRE_ARGS=(--prerelease --latest=false);; esac
          # Idempotent: if a release already exists at this tag, REPLACE its installers and ensure it is published;
          # otherwise create it already PUBLISHED (never a draft). Do NOT use `gh release create ... || upload`: for a
          # draft, create succeeds even when one already exists at the tag (GitHub lets multiple drafts share a tag),
          # so that pattern piles up duplicate drafts on every re-run. Checking first keeps it to exactly one release
          # and never un-publishes an already-published one (it just clobbers its assets).
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${FILES[@]}"
            # If it was still a draft from an earlier run, publish it now so downloads go live.
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${PRE_ARGS[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes "${PRE_ARGS[@]}" "${FILES[@]}"
          fi
