<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)">
	<meta name="referrer" content="no-referrer">
	<title>Shared securely</title>
	<style>
		/* Light is the base; dark follows the system. Self-contained so the page needs no external stylesheet.
		   color-scheme is set per theme so the browser draws its own chrome (the password field's caret, any autofill
		   or validation styling, and scrollbars) to match — without it, that chrome stays light over the dark surface
		   in the system's dark mode. */
		:root { color-scheme: light; --bg:#f4f6fb; --panel:#ffffff; --panel-2:#f0f2f8; --text:#1a2233; --muted:#5b6475; --border:#e2e6ef; --accent:#2f6bff; --danger:#c0362c; }
		@media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg:#0e1117; --panel:#161b25; --panel-2:#1d2430; --text:#e6ebf5; --muted:#9aa4b6; --border:#262e3d; --accent:#4d82ff; --danger:#f87171; } }
		* { box-sizing: border-box; }
		body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 24px 16px; }
		.wrap { width: 100%; max-width: 640px; }
		.brand { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin: 4px 2px 14px; }
		.card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
		h1 { font-size: 18px; margin: 0 0 4px; }
		.sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
		.field { display: flex; flex-direction: column; gap: 6px; margin: 0 0 12px; }
		.field span { font-size: 12px; color: var(--muted); }
		input[type=password] { padding: 10px 12px; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 9px; font-size: 15px; }
		button.primary { padding: 10px 16px; background: var(--accent); color: #fff; border: 0; border-radius: 9px; font-size: 15px; font-weight: 600; cursor: pointer; }
		.status { color: var(--muted); font-size: 14px; padding: 8px 0; }
		.status.err { color: var(--danger); }
		.meta { color: var(--muted); font-size: 12px; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
		.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 999px; padding: 9px 15px; font-size: 13px; }
		[hidden] { display: none !important; }
	</style>
</head>
<body>
	<div class="wrap">
		<div class="brand"><strong id="appName">Vaultonaut</strong> · shared securely</div>
		<div class="card">
			<h1 id="title">Someone shared an item with you</h1>
			<p class="sub" id="sub">It is decrypted only here in your browser — nothing readable ever reaches the server.</p>
			<div id="pwArea" hidden>
				<label class="field"><span>This link is protected by a password</span>
					<input id="pw" type="password" autocomplete="off" placeholder="Enter the password you were given"></label>
				<button class="primary" id="openBtn" type="button">Open</button>
			</div>
			<div id="openArea" hidden>
				<p class="sub">Opening this counts as a view and may be the only time it can be opened.</p>
				<button class="primary" id="openNoPwBtn" type="button">Open</button>
			</div>
			<div class="status" id="status" role="status" aria-live="polite" hidden></div>
			<div id="view"></div>
			<div class="meta" id="meta" hidden></div>
		</div>
	</div>
	<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
	<script src="/shared/secret-schema.js"></script>
	<script src="app.js"></script>
</body>
</html>
